<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Trainer - Practice English with Portuguese translations</title>
  <meta name="description" content="English Trainer helps you practice English phrases with Portuguese translations by context and audio. Choose a real-life situation, listen to sentences, and improve your English step by step." />
  <meta name="robots" content="index, follow" />
  <meta name="keywords" content="English trainer, English phrases, Portuguese translation, aprender inglês, frases em inglês, listening practice, English practice app" />
  <meta name="author" content="English Trainer" />
  <meta name="language" content="en" />

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="English Trainer - Practice English with Portuguese translations" />
  <meta property="og:description" content="Practice English phrases with Portuguese translations, organized by everyday contexts and with adjustable audio speed." />

  <!-- Twitter cards -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="English Trainer - Practice English with Portuguese translations" />
  <meta name="twitter:description" content="Practice English phrases with Portuguese translations, organized by everyday contexts and with adjustable audio speed." />

  <!-- Structured data for SEO -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "English Trainer",
      "description": "English Trainer helps you practice English phrases with Portuguese translations by context and audio.",
      "applicationCategory": "EducationalApplication",
      "inLanguage": ["en", "pt-BR"]
    }
  </script>
  <link rel="stylesheet" href="./main.css" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5587713354919719" crossorigin="anonymous"></script>
</head>

<body>
  <div id="app">
    <!-- Main trainer view (hidden on static pages) -->
    <div id="trainer-view">
    <header class="app-header">
      <button id="policyMenuToggle" class="menu-toggle" type="button" aria-label="Open menu" aria-haspopup="dialog" aria-controls="policyMenuModal" title="Menu">
        ☰
      </button>
      <div class="brand">
        <span class="brand-title">English Trainer</span>
        <span class="brand-subtitle">Frases inglês para português</span>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Alternar tema">
        <span class="theme-icon theme-icon-sun" aria-hidden="true">☀</span>
        <span class="theme-icon theme-icon-moon hidden" aria-hidden="true">🌙</span>
      </button>
    </header>

    <div id="policyMenuModal" class="policy-menu-modal hidden" role="dialog" aria-modal="true" aria-label="Menu">
      <button id="policyMenuBackdrop" class="policy-menu-backdrop" type="button" aria-label="Close menu"></button>
      <div class="policy-menu-panel" role="document">
        <div class="policy-menu-header">
          <div class="policy-menu-title">Menu</div>
          <button id="policyMenuClose" class="policy-menu-close" type="button" aria-label="Close menu" title="Close">
            ✕
          </button>
        </div>
        <nav class="policy-menu-links" aria-label="Policy links">
          <a class="policy-menu-link" href="./about.html">About</a>
          <a class="policy-menu-link" href="./cookies.html">Cookie Policy</a>
          <a class="policy-menu-link" href="./privacy-policy.html">Privacy Policy</a>
          <a class="policy-menu-link" href="./contact.html">Contact</a>
          <a class="policy-menu-link" href="./terms.html">Terms of Service</a>
        </nav>
      </div>
    </div>

    <!-- Top: context selector + progress bar -->
    <section class="top-bar">
      <div class="context-select-wrapper">
        <select id="contextSelect" class="field-select">
          <option value="" disabled selected>Escolha um contexto...</option>
        </select>
        <div id="contextLoadProgress" class="context-load-progress hidden" aria-hidden="true">
          <div class="context-load-progress-bar"></div>
          <span class="context-load-progress-label">Carregando contexto...</span>
        </div>
      </div>
      <div class="progress-wrapper">
        <div class="progress-header">
          <span id="progressText">0 / 0</span>
        </div>
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </div>
      <div class="speed-wrapper">
        <label for="speedSelect" class="speed-label">Velocidade</label>
        <select id="speedSelect" class="speed-select">
          <option value="0.4">0.4x</option>
          <option value="0.6">0.6x</option>
          <option value="0.8" selected>0.8x</option>
          <option value="1">1x</option>
          <option value="1.2">1.2x</option>
          <option value="1.4">1.4x</option>
        </select>
      </div>
    </section>

    <!-- Middle: ads + sentences -->
    <main class="app-main">
      <div class="content-layout">
        <div class="ad-column">
        <!-- <ins 
          class="adsbygoogle" 
          style="display:block; width:100%; max-width:100%;" 
          data-ad-client="ca-pub-5587713354919719"
          data-ad-test="on"
          data-ad-slot="1234567890"
          data-ad-format="auto" 
          data-full-width-responsive="true"></ins>
        <script>
          (adsbygoogle = window.adsbygoogle || []).push({});
        </script> -->
        </div>

        <div class="sentence-card">
          <div id="blockSentences" class="block-sentences">
            <div id="blockQuestion" class="sentence-question">
              <div class="sentence-line sentence-line--english">
                <p id="englishQuestion" class="sentence-text">—</p>
                <button id="micQuestionBtn" class="btn-mic hidden" type="button" title="Fale esta pergunta em inglês">
                  <img src="./img/mic-icon.png" alt="Ícone de microfone" />
                </button>
                <span id="micQuestionScore" class="speech-score"></span>
              </div>
              <p id="portugueseQuestion" class="sentence-text">—</p>
            </div>
            <div class="sentence-answer">
              <div class="sentence-line sentence-line--english">
                <p id="englishAnswer" class="sentence-text">—</p>
                <button id="micAnswerBtn" class="btn-mic hidden" type="button" title="Fale esta resposta em inglês">
                  <img src="./img/mic-icon.png" alt="Ícone de microfone" />
                </button>
                <span id="micAnswerScore" class="speech-score"></span>
              </div>
              <p id="portugueseAnswer" class="sentence-text">—</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom: all buttons -->
    <footer class="controls-bar">
      <div class="controls-left">
        <button id="playNormalBtn" class="btn btn-play btn-play-normal" disabled>
          ▶ Ouvir
        </button>
        <button id="listenAllBtn" class="btn btn-play btn-listen-all" disabled>
          Ouvir todos
        </button>
        <button id="prevBtn" class="btn btn-nav btn-prev" disabled>
          ◀ Anterior
        </button>
        <button id="nextBtn" class="btn btn-nav btn-next" disabled>
          Próximo ▶
        </button>
      </div>
    </footer>
    </div>

  </div>

  <script src="./main.js"></script>
</body>
</html>
